# awflex on Kubernetes: one pod, one small volume, no database.
#
# Nothing here names a namespace; apply it into one you already have:
#
#   kubectl -n <namespace> create secret generic awflex-auth \
#     --from-literal=AWFLEX_ADMIN_TOKEN="$(openssl rand -hex 32)" \
#     --from-literal=AWFLEX_HOOK_TOKEN="$(openssl rand -hex 32)" \
#     --from-literal=AWFLEX_SECRET_KEY="$(openssl rand -hex 32)"
#
#   # set AWFLEX_REPO, AWFLEX_INVENTORY and the image below, then
#   kubectl -n <namespace> apply -f deploy/k8s/awflex.yaml
#
#   # then check everything, including a real connection to one node:
#   kubectl -n <namespace> exec deploy/awflex -- awflex doctor --host <node>
#
# Every failed doctor check prints its fix. AGENTS.md lists known symptoms.
# Change settings here and in the image, never in awflex's source.
apiVersion: v1
kind: ConfigMap
metadata:
  name: awflex-config
data:
  AWFLEX_REPO: "https://git.example.com/infra/playbooks.git" # the one playbook repo
  AWFLEX_BRANCH: "main"       # used when a node names no branch
  AWFLEX_PLAYBOOK: "main.yml" # used when a node names no playbook
  # Where hosts get their groups from. A path inside the repo, or an absolute
  # path to a mounted file (see the inventory volume below). Remove it to have
  # awflex build an inventory from the calling hosts instead.
  AWFLEX_INVENTORY: "inventory/hosts.yml"
  # AWFLEX_HOOK_EXTRA_VARS: "1" # let nodes pass variables through the hook
  AWFLEX_BATCH_WINDOW: "10" # seconds a caller waits for others to share its ansible run
  AWFLEX_MAX_BATCH: "100"   # hosts per ansible run
  AWFLEX_FORKS: "25"        # ansible forks per run
  AWFLEX_MAX_FORKS: "50"    # forks across all runs: the memory knob, see "Sizing" in the README
  # AWFLEX_TRUST_PROXY: "1" # behind an ingress, take the caller address from X-Forwarded-For
---
# The data volume holds the queue, the last run per host, credentials and the
# git cache. Any volume type works. No volume claims allowed (for example a
# storage quota of 0)? Delete this object and follow "Storage without a
# claim" at the data volume in the Deployment below.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: awflex-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: awflex
spec:
  replicas: 1 # single writer; the queue is on the volume and survives restarts
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: awflex}
  template:
    metadata:
      labels: {app: awflex}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      automountServiceAccountToken: false # awflex never talks to the Kubernetes API
      terminationGracePeriodSeconds: 30
      # A private registry needs a pull secret in this namespace:
      #   kubectl -n <namespace> create secret docker-registry registry-pull \
      #     --docker-server=registry.example.com --docker-username=USER --docker-password=TOKEN
      # then uncomment:
      # imagePullSecrets:
      #   - name: registry-pull
      securityContext:
        # ssh needs a passwd entry for this uid. Both awflex images have one
        # for 1000 (deploy/Dockerfile.base adds it). Do not change this to 0.
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: awflex
          # Use a new tag for every build. A reused tag (for example :latest)
          # needs imagePullPolicy: Always, or nodes keep the old image. Check
          # what is running: kubectl exec deploy/awflex -- awflex version
          image: awflex:0.4.0 # your registry's copy
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: {name: awflex-config}
            - secretRef: {name: awflex-auth}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          resources:
            # Idle use is a few MB. Under load it is ansible's: measure one run
            # of your playbook, then set the limit and AWFLEX_MAX_FORKS together.
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 3Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: scratch, mountPath: /run/awflex} # per-run key files live only in memory
            # - {name: credentials, mountPath: /etc/awflex/credentials, readOnly: true}
            # - {name: inventory, mountPath: /etc/awflex/inventory, readOnly: true}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: awflex-data}
          # Storage without a claim: delete the PersistentVolumeClaim object
          # above, delete the persistentVolumeClaim line here, and uncomment:
          # nfs: {server: nfs.example.com, path: /exports/awflex}
          # The export must be writable by uid 1000; fsGroup does not apply to
          # NFS. A pod stuck in ContainerCreating with a mount error in
          # "kubectl describe pod" means the server or path is wrong.
        - name: scratch
          emptyDir: {medium: Memory, sizeLimit: 256Mi}
        # Credentials from a Secret of <name>.json files, instead of the API.
        # Also set AWFLEX_CREDENTIALS_DIR: /etc/awflex/credentials.
        # - name: credentials
        #   secret: {secretName: awflex-credentials}
        # An inventory kept outside the playbook repo, for example generated
        # from another system. Also set AWFLEX_INVENTORY: /etc/awflex/inventory.
        # - name: inventory
        #   configMap: {name: awflex-inventory}
---
apiVersion: v1
kind: Service
metadata:
  name: awflex
spec:
  # Nodes outside the cluster cannot reach a ClusterIP. Add the Ingress in
  # deploy/k8s/ingress.yaml, or switch this to NodePort or LoadBalancer.
  type: ClusterIP
  selector: {app: awflex}
  ports:
    - {name: http, port: 80, targetPort: http}
