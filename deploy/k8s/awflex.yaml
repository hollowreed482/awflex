# awflex on Kubernetes: one pod, one small volume, no database.
#
# Before applying, create the tokens (kept out of this file on purpose):
#
#   kubectl create namespace awflex
#   kubectl -n awflex create secret generic awflex-auth \
#     --from-literal=AWFLEX_ADMIN_TOKEN="$(openssl rand -hex 32)" \
#     --from-literal=AWFLEX_SECRET_KEY="$(openssl rand -hex 32)"
#
# Then set AWFLEX_REPO below and: kubectl apply -f deploy/k8s/awflex.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: awflex
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: awflex-config
  namespace: awflex
data:
  AWFLEX_REPO: "https://git.example.com/infra/playbooks.git" # the one playbook repo
  AWFLEX_BRANCH: "main"       # used when a node names no branch
  AWFLEX_PLAYBOOK: "main.yml" # used when a node names no playbook
  # AWFLEX_INVENTORY: "inventory/hosts.yml" # repo inventory; unset = inventory built from the calling hosts
  # AWFLEX_GROUPS: "compute"                # groups for hosts in a built inventory
  AWFLEX_BATCH_WINDOW: "10" # seconds a caller waits for others to share its ansible run
  AWFLEX_MAX_BATCH: "100"   # hosts per ansible run
  AWFLEX_FORKS: "25"        # ansible forks per run
  AWFLEX_MAX_FORKS: "50"    # forks across all runs; memory is about 40 MB per fork
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: awflex-data
  namespace: awflex
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi # queue, last run per host, credentials, git mirror
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: awflex
  namespace: awflex
spec:
  replicas: 1 # single writer; the queue is on the volume and survives restarts
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: awflex}
  template:
    metadata:
      labels: {app: awflex}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      automountServiceAccountToken: false # awflex never talks to the Kubernetes API
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: awflex
          image: awflex:0.1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: {name: awflex-config}
            - secretRef: {name: awflex-auth}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 3Gi} # raise with AWFLEX_MAX_FORKS
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: scratch, mountPath: /run/awflex} # per-run key files live only in memory
            # - {name: credentials, mountPath: /etc/awflex/credentials, readOnly: true}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: awflex-data}
        - name: scratch
          emptyDir: {medium: Memory, sizeLimit: 256Mi}
        # Credentials can also come from a Secret of <name>.json files instead of the API.
        # Mount it, and add AWFLEX_CREDENTIALS_DIR: /etc/awflex/credentials to the ConfigMap.
        # - name: credentials
        #   secret: {secretName: awflex-credentials}
---
apiVersion: v1
kind: Service
metadata:
  name: awflex
  namespace: awflex
spec:
  # Nodes outside the cluster need a reachable address: switch to NodePort or
  # LoadBalancer, or put an Ingress in front.
  type: ClusterIP
  selector: {app: awflex}
  ports:
    - {name: http, port: 80, targetPort: http}
